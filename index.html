*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.8 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100svh;overflow-x:hidden}button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}button:disabled{cursor:default}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #b56752;outline-offset:6px}::selection{background:#f1d4c7}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.world{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,780px) 280px;gap:46px;align-items:center;justify-content:center;width:min(1160px,calc(100% - 80px));margin:0 auto;padding:42px 0}.map-section{min-width:0;transition:filter 1.25s ease,opacity 1.25s ease,transform 1.25s ease;transform-origin:center;position:relative}.map-frame{position:relative;width:100%;aspect-ratio:760/620;border:1px solid #d9ddce;background:#eff0e2;box-shadow:0 8px 0 -5px #e7e6d9;overflow:hidden}.map-art{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}.map-title{position:absolute;left:23px;top:22px;font:8px/1.8 var(--pixel);letter-spacing:.06em;color:#7b8669;pointer-events:none}.map-compass{position:absolute;right:23px;top:21px;color:#748064;text-align:center;font:7px/2 var(--pixel)}.map-compass svg{display:block;width:18px;height:27px;margin:6px auto 0}.map-credit{position:absolute;bottom:9px;left:14px;font-size:8px;line-height:1.5;color:#868a77}.map-credit a{color:inherit;text-decoration:none}.map-credit a:hover{text-decoration:underline}.map-pin{position:absolute;transform:translate(-50%,-50%);width:54px;height:60px;border:0;padding:0;background:transparent;z-index:3;filter:drop-shadow(0 4px 0 #4a5b3826);transition:transform .2s}.map-pin:hover,.map-pin[aria-pressed=true]{transform:translate(-50%,-50%) translateY(-5px)}.map-pin svg{width:100%;height:100%}.pin-number{font-family:var(--pixel);font-size:12px;fill:#fffaf0}.pin-label{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);background:#faf7edee;color:#4c5941;padding:4px 7px;white-space:nowrap;font:8px/1.5 var(--pixel);pointer-events:none}.map-pin[aria-pressed=true] .pin-label{background:var(--green);color:#fffaf2}.route-line{stroke-dasharray:6 10;animation:route-flow 2.3s linear infinite}.town-label{font-family:var(--body);fill:#899378;font-size:12px;letter-spacing:2px}.small-town-label{font-family:var(--pixel);fill:#91997e;font-size:7px}.map-action{display:flex;justify-content:center;padding-top:28px}.accept-button{display:flex;align-items:center;justify-content:center;gap:13px;min-height:53px;background:var(--peach);color:#654d40;border:0;padding:14px 27px;box-shadow:4px 4px 0 #dfbda9;font-size:14px;font-weight:500;transition:transform .18s,box-shadow .18s}.accept-button:hover{transform:translate(-1px,-2px);box-shadow:5px 6px 0 #dfbda9}.accept-button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #dfbda9}.accept-button .emoji{font-family:system-ui,sans-serif;font-size:21px;line-height:1}.accept-button:disabled{pointer-events:none}
.narrator-dock{display:flex;align-items:center;justify-content:center;min-height:355px;margin-top:-45px;position:relative;z-index:8}.focus-layer{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;align-items:center;padding:28px;pointer-events:none}.focus-layer:empty{display:none}.narrator{position:relative;width:280px;max-width:calc(100vw - 48px);display:flex;align-items:center;flex-direction:column;pointer-events:auto;outline:none;transform-origin:50% 50%}.focus-layer .narrator{width:320px}.speech{width:100%;padding:19px 23px;background:var(--cream);border:1px solid #d9d9c8;box-shadow:4px 4px 0 #e8e7d9;font-size:13px;line-height:1.9;text-align:center;position:relative;min-height:116px;display:flex;align-items:center;justify-content:center;z-index:3}.focus-layer .speech{font-size:14px;min-height:112px;padding:20px 24px}.speech:after{content:'';position:absolute;width:13px;height:13px;background:var(--cream);border-right:1px solid #d9d9c8;border-bottom:1px solid #d9d9c8;transform:rotate(45deg);bottom:-7px;left:calc(50% - 7px)}.speech p{margin:0}.cat-area{position:relative;display:flex;justify-content:center;align-items:center;margin-top:26px;width:230px;height:217px}.cat-button{background:none;border:0;padding:0;width:200px;height:200px;position:relative;z-index:2;flex-shrink:0}.focus-layer .cat-area{width:260px;height:250px;margin-top:30px}.focus-layer .cat-button{width:230px;height:230px}.cat-art{width:100%;height:100%;overflow:visible;image-rendering:pixelated;filter:drop-shadow(0 6px 0 #dddac550)}.cat-bob{animation:bob 3.2s steps(2,end) infinite;transform-origin:50% 90%}.cat-eyes{animation:blink 5.3s steps(1,end) infinite;transform-box:fill-box;transform-origin:center}.cat-smile{display:none}.cat-ground{position:absolute;width:220px;height:22px;background:#e3e6d2;bottom:6px;clip-path:polygon(8% 0,91% 0,91% 25%,100% 25%,100% 75%,90% 75%,90% 100%,9% 100%,9% 75%,0 75%,0 25%,8% 25%)}.focus-layer .cat-ground{width:245px;bottom:8px}.float-heart{posit .mist{position:fixed;inset:-60px;z-index:-1;opacity:0;pointer-events:none;filter:blur(30px);transition:opacity 1.2s;background:radial-gradient(ellipse at 23% 35%,#e4e8d6 0,transparent 33%),radial-gradient(ellipse at 80% 65%,#eedbc9 0,transparent 35%),radial-gradient(ellipse at 42% 85%,#e9eadb 0,transparent 30%)}.heart-layer{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden;transition:opacity .7s}.celebration-heart{position:absolute;opacity:0;animation:heart-bloom 2.5s cubic-bezier(.2,.7,.2,1) forwards;filter:drop-shadow(2px 3px 0 #a56d5410)}.final-copy{display:none}html[data-phase=intro] .map-section{filter:blur(16px);opacity:.24;transform:scale(.985);pointer-events:none}html[data-phase=intro] .map-action{visibility:hidden}html[data-phase=leaving] .map-section,html[data-phase=locked] .map-section{filter:blur(22px);opacity:.13;transform:scale(.985);pointer-events:none}html[data-phase=leaving] .mist,html[data-phase=locked] .mist{opacity:1}html[data-phase=locked] .world,html[data-locked="1"] .world{display:none}html[data-phase=locked] .intro-copy,html[data-locked="1"] .intro-copy{display:none}html[data-phase=locked] .final-copy,html[data-locked="1"] .final-copy{display:inline}html[data-phase=locked] .cat-eyes,html[data-phase=locked] .cat-mouth-normal,html[data-locked="1"] .cat-eyes,html[data-locked="1"] .cat-mouth-normal{display:none}html[data-phase=locked] .cat-smile,html[data-locked="1"] .cat-smile{display:block}html[data-phase=locked] .speech{min-height:100px}html[data-locked="1"] .mist{opacity:1}

<script>
(()=>{
 'use strict';
 const STORAGE_KEY='sonya.date.2026-10-19.map-sealed';
 // Convenience for local testing; this static page does not use server authentication.
 const RESET_PASSWORD='murr1910';
 const FINAL='Я показываю карту только один раз, хехе';
 const INTRO='Мур-р… Кажется, у кого-то свидание намечается. Ищи подсказки на карте.';
 const MAP_INTRO='Сонька, 19 октября в 16:30. На карте две маленькие тайны. Нажми на любую — я подскажу ♡';
 const $=id=>document.getElementById(id);
 const html=document.documentElement;
 const world=$('world'),narrator=$('narrator'),dock=$('narrator-dock'),focus=$('focus-layer'),speech=$('speech'),catArea=$('cat-area'),hearts=$('heart-layer');
 const resetTools=$('reset-tools'),resetToggle=$('reset-toggle'),resetForm=$('reset-form'),resetInput=$('reset-password'),resetStatus=$('reset-status');
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const hints={
  1:['Не все истории живут в книгах. В некоторые можно заглянуть, а в другие — даже войти.','Здесь фантазия обретает форму, а взрослым разрешается ненадолго стать детьми. Мур.'],
  2:['После маленького приключения отправимся чуть южнее. Не покидая Мюнхен, конечно.','У этого секрета итальянское настроение. И стоит оставить немного места для сладкого.']
 };
 const visits={1:0,2:0};
 let phase='intro',sealed=false,baseSpeech=INTRO,petTimer=0,introTimer=0,endingTimer=0,movement=null;
 function remembered(){try{return localStorage.getItem(STORAGE_KEY)==='1'}catch{return false}}
 function remember(){try{localStorage.setItem(STORAGE_KEY,'1')}catch{}}
 function setPhase(next){phase=next;html.dataset.phase=next;}
 function say(text){clearTimeout(petTimer);baseSpeech=text;speech.textContent=text;}
 function cancelMovement(){if(movement){movement.cancel();movement=null}}
 async function moveCat(parent){
  cancelMovement();
  const from=narrator.getBoundingClientRect();parent.append(narrator);
  const to=narrator.getBoundingClientRect();
  if(reduced||typeof narrator.animate!=='function'||!from.width||!to.width)return;
  const dx=from.left+from.width/2-to.left-to.width/2;
  const dy=from.top+from.height/2-to.top-to.height/2;
  const anim=narrator.animate([
   {transform:`translate(${dx}px,${dy}px) scale(${from.width/to.width},${from.height/to.height})`},
   {transform:'translate(0,0) scale(1,1)'}
  ],{duration:1050,easing:'cubic-bezier(.22,.75,.15,1)',fill:'none'});
  movement=anim;try{await anim.finished}catch{}if(movement===anim)movement=null;
 }
 function lockScene(){
  sealed=true;clearTimeout(introTimer);clearTimeout(petTimer);clearTimeout(endingTimer);cancelMovement();
  if(narrator.parentElement!==focus)focus.append(narrator);
  html.dataset.locked='1';setPhase('locked');say(FINAL);
  world.inert=true;world.setAttribute('aria-hidden','true');world.remove();
  hearts.replaceChildren();hearts.style.opacity='1';
  resetTools.hidden=false;
 }
 async function openMap(){
  if(sealed||remembered()){lockScene();return}
  setPhase('opening');
  await moveCat(dock);
  if(sealed||remembered()){lockScene();return}
  setPhase('map');world.inert=false;world.removeAttribute('aria-hidden');say(MAP_INTRO);
 }
 function heartAt(parent,x,y,size,color,delay=0,pet=false){
  const heart=document.createElementNS('http://www.w3.org/2000/svg','svg');
  heart.setAttribute('viewBox','0 0 16 16');heart.setAttribute('aria-hidden','true');
  heart.classList.add(pet?'pet-particle':'celebration-heart');
  if(!pet){heart.style.left=x+'%';heart.style.top=y+'%';heart.style.width=size+'px';heart.style.height=size+'px';heart.style.animationDelay=delay+'ms'}
  else heart.style.setProperty('--drift',x+'px');
  heart.style.color=color;
  const use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#heart');heart.append(use);parent.append(heart);
  if(pet)setTimeout(()=>heart.remove(),1450);
 }
 function celebrate(){
  if(phase!=='map'||sealed)return;
  sealed=true;remember();clearTimeout(petTimer);setPhase('celebrating');
  world.inert=true;world.setAttribute('aria-hidden','true');$('accept-date').disabled=true;
  say('Мур-р! Я так и знал ♡');
  for(let i=0;i<(reduced?24:90);i++)heartAt(hearts,(i*37.19)%96,(i*61.31)%92,18+(i%7)*6,['#d69780','#db9b91','#bf7970','#edbda9'][i%4],reduced?0:(i%13)*55);
  endingTimer=setTimeout(async()=>{
   if(phase==='locked')return;
   setPhase('leaving');say(FINAL);
   await moveCat(focus);
   if(phase==='locked')return;
   lockScene();narrator.focus({preventScroll:true});
  },reduced?650:1600);
 }
 document.querySelectorAll('.map-pin').forEach(button=>button.addEventListener('click',()=>{
  if(phase!=='map'||sealed)return;
  const id=Number(button.dataset.secret);const lines=hints[id];if(!lines)return;
  say(lines[visits[id]++%lines.length]);
  document.querySelectorAll('.map-pin').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
 }));
 $('pet-cat').addEventListener('click',()=>{
  if(!reduced)for(const drift of [-35,0,35])heartAt(catArea,drift,0,22,'#dc897d',0,true);
  if(phase!=='map')return;
  clearTimeout(petTimer);speech.textContent='Мур-мур… Ладно, погладить можно. Но названия всё равно не выдам ♡';
  petTimer=setTimeout(()=>{if(phase==='map'&&!sealed)speech.textContent=baseSpeech},2100);
 });
 $('accept-date').addEventListener('click',celebrate);
 function setResetOpen(open){
  resetForm.hidden=!open;resetToggle.setAttribute('aria-expanded',String(open));
  resetToggle.setAttribute('aria-label',open?'Скрыть поле пароля':'Открыть поле пароля');
  html.dataset.resetOpen=open?'1':'0';resetStatus.textContent='';resetInput.removeAttribute('aria-invalid');
  if(open)resetInput.focus();else{resetInput.value='';resetToggle.focus({preventScroll:true})}
 }
 resetToggle.addEventListener('click',()=>{if(phase==='locked')setResetOpen(resetForm.hidden)});
 resetInput.addEventListener('input',()=>{resetStatus.textContent='';resetInput.removeAttribute('aria-invalid')});
 resetInput.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();setResetOpen(false)}});
 resetForm.addEventListener('submit',event=>{
  event.preventDefault();if(phase!=='locked'||resetForm.hidden)return;
  if(resetInput.value!==RESET_PASSWORD){
   resetStatus.textContent='Не тот пароль, мур.';resetInput.setAttribute('aria-invalid','true');resetInput.focus();return;
  }
  try{localStorage.removeItem(STORAGE_KEY)}catch{
   if(remembered()){resetStatus.textContent='Не получилось сбросить. Разреши хранение данных для сайта.';return}
  }
  resetInput.value='';window.location.reload();
 });
 window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&event.newValue==='1')lockScene()});
 window.addEventListener('pageshow',()=>{if(remembered()&&phase!=='locked')lockScene()});
 if(html.dataset.locked==='1'||remembered())lockScene();
 else{setPhase('intro');introTimer=setTimeout(openMap,5100)}
})();
</script>
</body>
</html>
